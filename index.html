<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>CEZOO Payment</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#f5f6f8;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.page{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#fff;
}

/* HEADER */

.header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #ededed;
}

.back{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  font-size:29px;
  line-height:1;
  cursor:pointer;
  color:#111;
}

.headerText{
  margin-left:4px;
}

.headerTitle{
  font-size:17px;
  font-weight:750;
}

.headerSub{
  margin-top:2px;
  font-size:10px;
  color:#9297a0;
}


/* AMOUNT */

.amountArea{
  padding:32px 20px 29px;
  text-align:center;
}

.amountLabel{
  font-size:13px;
  color:#777d86;
}

.amount{
  margin-top:8px;
  font-size:40px;
  line-height:1;
  font-weight:850;
  letter-spacing:-1.4px;
}

.secure{
  margin-top:12px;
  font-size:11.5px;
  color:#8a9098;
}


/* DIVIDER */

.divider{
  height:8px;
  background:#f5f6f8;
}


/* PAYMENT METHODS */

.methods{
  padding:24px 18px;
}

.title{
  margin-bottom:15px;
  font-size:15px;
  font-weight:750;
}

.option{
  width:100%;
  min-height:74px;
  padding:12px 14px;
  margin-bottom:11px;
  display:flex;
  align-items:center;
  border:1px solid #e8e9ec;
  border-radius:16px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  transition:.15s ease;
}

.option:active{
  transform:scale(.985);
  background:#fafafa;
}

.option:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.logo{
  width:46px;
  height:46px;
  flex-shrink:0;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.phonepeLogo{
  background:#5f259f;
  color:#fff;
  font-size:24px;
  font-weight:900;
}

.paytmLogo{
  background:#eff9ff;
  font-size:13px;
  font-weight:900;
}

.payBlue{
  color:#00a9e8;
}

.payDark{
  color:#123d73;
}

.optionInfo{
  flex:1;
  min-width:0;
  margin-left:13px;
}

.optionName{
  font-size:15.5px;
  font-weight:750;
}

.optionSub{
  margin-top:4px;
  font-size:12px;
  color:#8a9098;
}

.arrow{
  margin-left:10px;
  color:#a0a5ad;
  font-size:24px;
}


/* INFO */

.info{
  margin-top:18px;
  padding:14px;
  display:flex;
  gap:9px;
  border-radius:13px;
  background:#f7f8fa;
}

.infoIcon{
  font-size:14px;
}

.infoText{
  font-size:11.5px;
  line-height:1.5;
  color:#737983;
}


/* FOOTER */

.footer{
  padding:5px 20px 30px;
  text-align:center;
  font-size:11px;
  color:#a1a6ae;
}


/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.42);
  opacity:0;
  visibility:hidden;
  transition:.2s ease;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}


/* SHEET */

.sheet{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:10000;
  width:100%;
  max-width:480px;
  padding:13px 21px 30px;
  background:#fff;
  border-radius:25px 25px 0 0;
  transform:translate(-50%,105%);
  transition:.28s ease;
  box-shadow:0 -10px 40px rgba(0,0,0,.10);
}

.sheet.show{
  transform:translate(-50%,0);
}

.handle{
  width:40px;
  height:4px;
  margin:0 auto 27px;
  border-radius:20px;
  background:#dedede;
}


/* LOADER */

.loader{
  width:50px;
  height:50px;
  margin:0 auto 20px;
  border:4px solid #eeeeee;
  border-top-color:#111827;
  border-radius:50%;
  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* STATUS */

.statusIcon{
  width:68px;
  height:68px;
  margin:0 auto 18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:800;
}

.successIcon{
  background:#e8f8ef;
  color:#15945d;
}

.failedIcon{
  background:#fff0f0;
  color:#df4147;
}

.sheetTitle{
  text-align:center;
  font-size:21px;
  font-weight:850;
}

.sheetAmount{
  margin-top:8px;
  text-align:center;
  font-size:18px;
  font-weight:750;
}

.sheetText{
  max-width:330px;
  margin:9px auto 0;
  text-align:center;
  color:#7c828b;
  font-size:13px;
  line-height:1.5;
}

.reference{
  margin-top:16px;
  padding:11px;
  border-radius:10px;
  background:#f6f7f8;
  color:#777d86;
  font-size:10.5px;
  text-align:center;
  word-break:break-all;
}

.action{
  width:100%;
  height:52px;
  margin-top:23px;
  border:0;
  border-radius:14px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:750;
  cursor:pointer;
}

.secondary{
  background:#f1f2f4;
  color:#111827;
  margin-top:10px;
}


/* INVALID */

.invalid{
  padding:80px 25px;
  text-align:center;
}

.invalid h2{
  font-size:20px;
}

.invalid p{
  margin-top:8px;
  color:#777;
  font-size:13px;
}


/* DESKTOP */

@media(min-width:600px){

  body{
    display:flex;
    justify-content:center;
  }

  .page{
    box-shadow:0 0 40px rgba(0,0,0,.06);
  }
}
</style>
</head>


<body>

<div class="page">


  <!-- HEADER -->

  <header class="header">

    <button
      class="back"
      onclick="history.back()">
      ‹
    </button>

    <div class="headerText">

      <div class="headerTitle">
        Complete payment
      </div>

      <div class="headerSub">
        CEZOO secure checkout
      </div>

    </div>

  </header>


  <!-- AMOUNT -->

  <section class="amountArea">

    <div class="amountLabel">
      Amount to pay
    </div>

    <div
      class="amount"
      id="amount">
      ₹0
    </div>

    <div class="secure">
      🔒 Secure UPI payment
    </div>

  </section>


  <div class="divider"></div>


  <!-- METHODS -->

  <section class="methods">

    <div class="title">
      Choose payment app
    </div>


    <!-- PHONEPE -->

    <button
      class="option"
      id="phonepeButton"
      onclick="startPayment('phonepe')">

      <div class="logo phonepeLogo">
        P
      </div>

      <div class="optionInfo">

        <div class="optionName">
          PhonePe
        </div>

        <div class="optionSub">
          Pay securely using PhonePe UPI
        </div>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- PAYTM -->

    <button
      class="option"
      id="paytmButton"
      onclick="startPayment('paytm')">

      <div class="logo paytmLogo">

        <span class="payDark">
          Pay
        </span>

        <span class="payBlue">
          tm
        </span>

      </div>

      <div class="optionInfo">

        <div class="optionName">
          Paytm
        </div>

        <div class="optionSub">
          Pay securely using Paytm UPI
        </div>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <div class="info">

      <div class="infoIcon">
        🛡️
      </div>

      <div class="infoText">
        Complete the payment in your selected
        UPI app. After returning to CEZOO,
        your payment status will be checked.
      </div>

    </div>

  </section>


  <div class="footer">
    Payments powered by UPI
  </div>

</div>


<!-- OVERLAY -->

<div
  class="overlay"
  id="overlay">
</div>


<!-- SHEET -->

<div
  class="sheet"
  id="sheet">

  <div class="handle"></div>

  <div id="sheetContent"></div>

</div>


<script>

/* =========================================
   CONFIG
========================================= */

const API = "";

const params =
  new URLSearchParams(
    window.location.search
  );

const rawAmount =
  params.get("amount");

const PAYMENT_AMOUNT =
  Number(rawAmount);


let currentOrderId = null;

let statusTimer = null;

let creatingPayment = false;

let waitingForReturn = false;


/* =========================================
   AMOUNT
========================================= */

if(
  Number.isFinite(PAYMENT_AMOUNT) &&
  PAYMENT_AMOUNT > 0
){

  document.getElementById(
    "amount"
  ).textContent =
    "₹" +
    formatAmount(PAYMENT_AMOUNT);

}else{

  document.getElementById(
    "amount"
  ).textContent =
    "Amount unavailable";

  setButtonsDisabled(true);

}


/* =========================================
   FORMAT
========================================= */

function formatAmount(value){

  return Number(value)
    .toLocaleString(
      "en-IN",
      {
        maximumFractionDigits:2
      }
    );

}


/* =========================================
   START PAYMENT
========================================= */

async function startPayment(app){

  if(creatingPayment){
    return;
  }

  if(
    !Number.isFinite(PAYMENT_AMOUNT) ||
    PAYMENT_AMOUNT <= 0
  ){
    return;
  }


  creatingPayment = true;

  setButtonsDisabled(true);

  showPreparing();


  try{

    const response =
      await fetch(
        API +
        "/api/payment/create",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              amount:
                PAYMENT_AMOUNT,

              app:
                app
            })
        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "Unable to create payment"
      );

    }


    currentOrderId =
      result.orderId;


    localStorage.setItem(
      "cezooPendingPayment",
      JSON.stringify({

        orderId:
          currentOrderId,

        amount:
          PAYMENT_AMOUNT,

        createdAt:
          Date.now()

      })
    );


    /*
      Start checking in background.
      PENDING will not show any popup.
    */

    startStatusChecking();


    /*
      Mark that we are waiting for
      the customer to return from UPI.
    */

    waitingForReturn = true;


    /*
      OPEN PHONEPE / PAYTM
    */

    openUPIApp(
      app,
      result.upiUrl
    );


  }

  catch(error){

    console.error(error);

    creatingPayment = false;

    setButtonsDisabled(false);

    showError(
      error.message ||
      "Payment service unavailable"
    );

  }

}


/* =========================================
   OPEN UPI APP
========================================= */

function openUPIApp(
  app,
  upiUrl
){

  if(!upiUrl){

    showError(
      "UPI payment link unavailable"
    );

    return;

  }


  const ua =
    navigator.userAgent ||
    navigator.vendor ||
    window.opera;


  const isAndroid =
    /Android/i.test(ua);

  const isIOS =
    /iPhone|iPad|iPod/i.test(ua);


  /* =====================================
     ANDROID
  ===================================== */

  if(isAndroid){

    const upiData =
      upiUrl.replace(
        /^upi:\/\//i,
        ""
      );


    let packageName = "";


    if(app === "phonepe"){

      packageName =
        "com.phonepe.app";

    }

    else if(app === "paytm"){

      packageName =
        "net.one97.paytm";

    }


    if(packageName){

      const intentUrl =
        "intent://" +
        upiData +
        "#Intent;" +
        "scheme=upi;" +
        "package=" +
        packageName +
        ";" +
        "end";


      /*
        IMPORTANT:
        Do not show waiting here.
        Only attempt to launch app.
      */

      window.location.href =
        intentUrl;


      return;

    }

  }


  /* =====================================
     iOS / OTHER
  ===================================== */

  if(isIOS){

    /*
      iOS browsers handle UPI schemes
      according to installed app support.
    */

    window.location.href =
      upiUrl;

    return;

  }


  /* =====================================
     DESKTOP / FALLBACK
  ===================================== */

  window.location.href =
    upiUrl;

}


/* =========================================
   STATUS CHECKER
========================================= */

function startStatusChecking(){

  stopStatusChecking();

  checkPaymentStatus();


  statusTimer =
    setInterval(
      checkPaymentStatus,
      3000
    );

}


function stopStatusChecking(){

  if(statusTimer){

    clearInterval(
      statusTimer
    );

    statusTimer = null;

  }

}


/* =========================================
   STATUS API
========================================= */

async function checkPaymentStatus(){

  if(!currentOrderId){
    return;
  }


  try{

    const response =
      await fetch(

        API +
        "/api/payment/status/" +
        encodeURIComponent(
          currentOrderId
        ),

        {
          cache:"no-store"
        }

      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){
      return;
    }


    const status =
      String(
        result.status || ""
      ).toUpperCase();


    /*
      ACCEPTED
    */

    if(
      status === "ACCEPTED" ||
      status === "SUCCESS"
    ){

      stopStatusChecking();

      clearPendingPayment();

      showSuccess(
        result.transactionId
      );

      return;

    }


    /*
      REJECTED
    */

    if(
      status === "REJECTED" ||
      status === "FAILED"
    ){

      stopStatusChecking();

      clearPendingPayment();

      showFailed();

      return;

    }


    /*
      PENDING:
      do absolutely nothing.

      No popup.
      No automatic Accepted.
    */

  }

  catch(error){

    console.error(
      "Payment status error:",
      error
    );

  }

}


/* =========================================
   RETURN FROM APP
========================================= */

window.addEventListener(
  "focus",
  function(){

    if(
      currentOrderId &&
      waitingForReturn
    ){

      waitingForReturn = false;

      creatingPayment = false;

      setButtonsDisabled(false);

      /*
        Now customer has returned.
        Show waiting status.
      */

      showWaiting();

      checkPaymentStatus();

    }

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState === "visible" &&
      currentOrderId &&
      waitingForReturn
    ){

      waitingForReturn = false;

      creatingPayment = false;

      setButtonsDisabled(false);

      showWaiting();

      checkPaymentStatus();

    }

  }
);


/* =========================================
   RESTORE PENDING
========================================= */

(function restorePayment(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "cezooPendingPayment"
        )
      );


    if(!saved){
      return;
    }


    const age =
      Date.now() -
      Number(
        saved.createdAt || 0
      );


    /*
      30 minutes maximum
    */

    if(
      age >
      30 * 60 * 1000
    ){

      clearPendingPayment();

      return;

    }


    currentOrderId =
      saved.orderId;


    if(currentOrderId){

      /*
        If page is reloaded after returning,
        show waiting state.
      */

      creatingPayment = false;

      setButtonsDisabled(false);

      showWaiting();

      startStatusChecking();

    }

  }

  catch(error){

    clearPendingPayment();

  }

})();


/* =========================================
   PREPARING
========================================= */

function showPreparing(){

  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="loader"></div>

    <div class="sheetTitle">
      Opening payment app
    </div>

    <div class="sheetAmount">
      ₹${formatAmount(PAYMENT_AMOUNT)}
    </div>

    <div class="sheetText">
      Please wait...
    </div>

  `;


  openSheet();

}


/* =========================================
   WAITING
========================================= */

function showWaiting(){

  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="loader"></div>

    <div class="sheetTitle">
      Waiting for confirmation
    </div>

    <div class="sheetAmount">
      ₹${formatAmount(PAYMENT_AMOUNT)}
    </div>

    <div class="sheetText">

      Payment request has been created.

      <br>

      Waiting for confirmation.

    </div>

    <div class="reference">

      Order:
      ${escapeHTML(
        currentOrderId || "-"
      )}

    </div>

    <button
      class="action"
      onclick="checkPaymentStatus()">

      Check payment status

    </button>

    <button
      class="action secondary"
      onclick="closeSheet()">

      Close

    </button>

  `;


  openSheet();

}


/* =========================================
   SUCCESS
========================================= */

function showSuccess(
  transactionId
){

  creatingPayment = false;

  setButtonsDisabled(false);


  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="
      statusIcon
      successIcon
    ">
      ✓
    </div>

    <div class="sheetTitle">
      Payment accepted
    </div>

    <div class="sheetAmount">
      ₹${formatAmount(PAYMENT_AMOUNT)}
    </div>

    <div class="sheetText">
      Your payment has been confirmed.
    </div>

    ${
      transactionId
      ?
      `
      <div class="reference">
        Transaction:
        ${escapeHTML(transactionId)}
      </div>
      `
      :
      ""
    }

    <button
      class="action"
      onclick="closeSheet()">

      Done

    </button>

  `;


  openSheet();

}


/* =========================================
   FAILED
========================================= */

function showFailed(){

  creatingPayment = false;

  setButtonsDisabled(false);


  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="
      statusIcon
      failedIcon
    ">
      ×
    </div>

    <div class="sheetTitle">
      Payment failed
    </div>

    <div class="sheetAmount">
      ₹${formatAmount(PAYMENT_AMOUNT)}
    </div>

    <div class="sheetText">
      The payment was not completed.
    </div>

    <button
      class="action"
      onclick="closeSheet()">

      Try again

    </button>

  `;


  openSheet();

}


/* =========================================
   ERROR
========================================= */

function showError(message){

  creatingPayment = false;

  setButtonsDisabled(false);


  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="
      statusIcon
      failedIcon
    ">
      !
    </div>

    <div class="sheetTitle">
      Unable to continue
    </div>

    <div class="sheetText">
      ${escapeHTML(message)}
    </div>

    <button
      class="action"
      onclick="closeSheet()">

      Close

    </button>

  `;


  openSheet();

}


/* =========================================
   SHEET
========================================= */

function openSheet(){

  document
    .getElementById("overlay")
    .classList.add("show");

  document
    .getElementById("sheet")
    .classList.add("show");

}


function closeSheet(){

  document
    .getElementById("overlay")
    .classList.remove("show");

  document
    .getElementById("sheet")
    .classList.remove("show");

}


/* =========================================
   BUTTONS
========================================= */

function setButtonsDisabled(
  disabled
){

  const phonepe =
    document.getElementById(
      "phonepeButton"
    );

  const paytm =
    document.getElementById(
      "paytmButton"
    );


  if(phonepe){
    phonepe.disabled =
      disabled;
  }

  if(paytm){
    paytm.disabled =
      disabled;
  }

}


/* =========================================
   CLEAR
========================================= */

function clearPendingPayment(){

  localStorage.removeItem(
    "cezooPendingPayment"
  );

  currentOrderId = null;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>

</body>
</html>
