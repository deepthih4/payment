<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>CEZOO Payment</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --text:#111827;
  --muted:#6b7280;
  --border:#e8eaed;
  --page:#f5f6f8;
  --green:#15945f;
  --red:#df3d43;
}

body{

  min-height:100vh;

  background:var(--page);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  color:var(--text);

}


.paymentPage{

  width:100%;

  max-width:480px;

  min-height:100vh;

  margin:auto;

  background:#fff;

}


/* ==========================
   HEADER
========================== */

.header{

  height:62px;

  padding:0 17px;

  display:flex;

  align-items:center;

  border-bottom:
    1px solid #eeeeee;

}


.backButton{

  width:38px;

  height:38px;

  border:0;

  background:transparent;

  font-size:28px;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  cursor:pointer;

}


.headerTitle{

  margin-left:4px;

  font-size:17px;

  font-weight:750;

}


/* ==========================
   AMOUNT
========================== */

.amountSection{

  padding:
    31px 20px
    28px;

  text-align:center;

}


.amountLabel{

  font-size:13px;

  color:var(--muted);

}


.amount{

  margin-top:8px;

  font-size:39px;

  line-height:1;

  font-weight:800;

  letter-spacing:-1.2px;

}


.secure{

  margin-top:12px;

  font-size:12px;

  color:#888e97;

}


.divider{

  height:8px;

  background:var(--page);

}


/* ==========================
   PAYMENT METHODS
========================== */

.methods{

  padding:
    23px 17px
    25px;

}


.sectionTitle{

  margin-bottom:15px;

  font-size:15px;

  font-weight:750;

}


.paymentOption{

  width:100%;

  min-height:73px;

  margin-bottom:11px;

  padding:12px 14px;

  border:
    1px solid var(--border);

  border-radius:16px;

  background:#fff;

  display:flex;

  align-items:center;

  cursor:pointer;

  text-align:left;

  transition:.15s;

}


.paymentOption:active{

  transform:
    scale(.985);

  background:#fafafa;

}


.paymentOption:disabled{

  opacity:.55;

  cursor:not-allowed;

}


.logo{

  width:46px;

  height:46px;

  flex-shrink:0;

  border-radius:13px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-weight:800;

}


/* PHONEPE */

.phonepeLogo{

  background:#5f259f;

  color:#fff;

  font-size:23px;

}


/* PAYTM */

.paytmLogo{

  background:#f0f8ff;

  font-size:13px;

}


.paytmDark{

  color:#143d73;

}


.paytmBlue{

  color:#00a9e8;

}


.methodInfo{

  flex:1;

  min-width:0;

  margin-left:13px;

}


.methodName{

  font-size:15.5px;

  font-weight:700;

}


.methodSub{

  margin-top:4px;

  color:#8b9199;

  font-size:12px;

}


.arrow{

  margin-left:10px;

  color:#a3a7ad;

  font-size:24px;

}


/* ==========================
   INFO
========================== */

.infoBox{

  margin-top:17px;

  padding:13px;

  border-radius:13px;

  background:#f7f8fa;

  display:flex;

  align-items:flex-start;

  gap:9px;

}


.infoText{

  font-size:11.5px;

  line-height:1.5;

  color:#737983;

}


.footer{

  padding:
    5px 20px
    30px;

  text-align:center;

  font-size:11px;

  color:#a0a5ad;

}


/* ==========================
   INVALID AMOUNT
========================== */

.invalid{

  padding:
    80px 25px;

  text-align:center;

}


.invalid h2{

  font-size:20px;

}


.invalid p{

  margin-top:8px;

  font-size:13px;

  color:#777;

}


/* ==========================
   STATUS OVERLAY
========================== */

.overlay{

  position:fixed;

  inset:0;

  z-index:99999;

  display:none;

  align-items:flex-end;

  justify-content:center;

  background:
    rgba(15,23,42,.44);

}


.sheet{

  width:100%;

  max-width:480px;

  padding:
    12px 22px
    31px;

  border-radius:
    25px 25px
    0 0;

  background:#fff;

  text-align:center;

  animation:
    slideUp .25s ease;

}


@keyframes slideUp{

  from{
    transform:
      translateY(100%);
  }

  to{
    transform:
      translateY(0);
  }

}


.handle{

  width:38px;

  height:4px;

  margin:
    0 auto 28px;

  border-radius:20px;

  background:#dedede;

}


/* ==========================
   LOADER
========================== */

.loader{

  width:52px;

  height:52px;

  margin:
    0 auto 20px;

  border:
    4px solid #edf0f2;

  border-top-color:#111827;

  border-radius:50%;

  animation:
    spin .75s linear infinite;

}


@keyframes spin{

  to{
    transform:
      rotate(360deg);
  }

}


/* ==========================
   STATUS
========================== */

.statusCircle{

  width:68px;

  height:68px;

  margin:
    0 auto 18px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:34px;

  font-weight:700;

}


.success{

  background:#e9f9f0;

  color:var(--green);

}


.failed{

  background:#fff0f0;

  color:var(--red);

}


.statusTitle{

  font-size:21px;

  font-weight:800;

}


.statusAmount{

  margin-top:7px;

  font-size:17px;

  font-weight:700;

}


.statusSub{

  margin-top:7px;

  color:#858b94;

  font-size:13px;

  line-height:1.5;

}


.orderReference{

  margin-top:14px;

  padding:10px;

  border-radius:10px;

  background:#f7f8fa;

  color:#747982;

  font-size:10px;

  word-break:
    break-all;

}


.actionButton{

  width:100%;

  height:52px;

  margin-top:24px;

  border:0;

  border-radius:14px;

  background:#111827;

  color:#fff;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

}


.secondaryButton{

  width:100%;

  height:48px;

  margin-top:9px;

  border:
    1px solid #e5e7eb;

  border-radius:14px;

  background:#fff;

  color:#333;

  font-size:14px;

  font-weight:650;

  cursor:pointer;

}


@media(min-width:600px){

  body{

    display:flex;

    justify-content:center;

  }

  .paymentPage{

    box-shadow:
      0 0 40px
      rgba(0,0,0,.06);

  }

}

</style>

</head>


<body>


<div class="paymentPage">


<header class="header">

  <button
    class="backButton"
    onclick="history.back()">
    ‹
  </button>

  <div class="headerTitle">
    Complete payment
  </div>

</header>



<main id="mainContent">


<section class="amountSection">

  <div class="amountLabel">
    Amount to pay
  </div>

  <div
    class="amount"
    id="amountText">
    ₹0
  </div>

  <div class="secure">
    🔒 Secure UPI payment
  </div>

</section>



<div class="divider"></div>



<section class="methods">

  <div class="sectionTitle">
    Choose payment app
  </div>


  <!-- PHONEPE -->

  <button
    class="paymentOption"
    id="phonepeButton"
    onclick="startPayment('phonepe')">

    <div class="logo phonepeLogo">
      P
    </div>

    <div class="methodInfo">

      <div class="methodName">
        PhonePe
      </div>

      <div class="methodSub">
        Pay using PhonePe UPI
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>



  <!-- PAYTM -->

  <button
    class="paymentOption"
    id="paytmButton"
    onclick="startPayment('paytm')">

    <div class="logo paytmLogo">

      <span class="paytmDark">
        Pay
      </span>

      <span class="paytmBlue">
        tm
      </span>

    </div>

    <div class="methodInfo">

      <div class="methodName">
        Paytm
      </div>

      <div class="methodSub">
        Pay using Paytm UPI
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>



  <div class="infoBox">

    <div>
      🛡️
    </div>

    <div class="infoText">

      Complete the payment in your UPI app
      and return to this page.

      Your payment will remain pending
      until it is confirmed.

    </div>

  </div>

</section>



<div class="footer">
  Payments through UPI
</div>


</main>

</div>



<!-- ==========================
     STATUS BOTTOM SHEET
=========================== -->

<div
  class="overlay"
  id="statusOverlay">

  <div
    class="sheet"
    id="statusSheet">
  </div>

</div>



<script>

/* ========================================
   PAYMENT AMOUNT
======================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const rawAmount =
  urlParams.get("amount");


const PAYMENT_AMOUNT =
  Number(rawAmount);


/* ========================================
   CURRENT PAYMENT
======================================== */

let currentOrderId = null;

let statusTimer = null;

let creatingPayment = false;


/* ========================================
   FORMAT MONEY
======================================== */

function formatMoney(value){

  return new Intl.NumberFormat(
    "en-IN",
    {
      style:"currency",
      currency:"INR",
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  ).format(value);

}


/* ========================================
   VALIDATE AMOUNT
======================================== */

if(
  !Number.isFinite(PAYMENT_AMOUNT) ||
  PAYMENT_AMOUNT <= 0
){

  document.getElementById(
    "mainContent"
  ).innerHTML = `

    <div class="invalid">

      <h2>
        Payment amount unavailable
      </h2>

      <p>
        Please return to checkout
        and try again.
      </p>

    </div>

  `;

}

else{

  document.getElementById(
    "amountText"
  ).textContent =
    formatMoney(
      PAYMENT_AMOUNT
    );

}


/* ========================================
   PAYMENT BUTTONS
======================================== */

function setButtonsDisabled(disabled){

  const phonepe =
    document.getElementById(
      "phonepeButton"
    );

  const paytm =
    document.getElementById(
      "paytmButton"
    );

  if(phonepe){
    phonepe.disabled =
      disabled;
  }

  if(paytm){
    paytm.disabled =
      disabled;
  }

}


/* ========================================
   START PAYMENT
======================================== */

async function startPayment(app){

  if(creatingPayment){
    return;
  }

  if(
    !Number.isFinite(PAYMENT_AMOUNT) ||
    PAYMENT_AMOUNT <= 0
  ){
    return;
  }


  creatingPayment = true;

  setButtonsDisabled(true);

  showPreparing();


  try{

    const response =
      await fetch(
        "/api/payment/create",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              amount:
                PAYMENT_AMOUNT,

              app:
                app

            })

        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "Unable to create payment"
      );

    }


    currentOrderId =
      result.orderId;


    localStorage.setItem(
      "cezooPendingPayment",
      JSON.stringify({

        orderId:
          currentOrderId,

        amount:
          PAYMENT_AMOUNT,

        createdAt:
          Date.now()

      })
    );


    /*
      Start checking status BEFORE
      opening the UPI app.
    */

    startStatusChecking();


    /*
      OPEN GENERIC UPI INTENT

      On supported mobile devices this
      lets the installed UPI app handle
      the payment request.
    */

    window.location.href =
      result.upiUrl;


    /*
      If browser remains visible,
      show waiting state.
    */

    setTimeout(
      () => {

        showWaiting();

      },
      1200
    );


  }

  catch(error){

    console.error(
      error
    );

    creatingPayment = false;

    setButtonsDisabled(false);

    showError(
      error.message ||
      "Payment service unavailable"
    );

  }

}


/* ========================================
   PREPARING
======================================== */

function showPreparing(){

  showSheet(`

    <div class="handle"></div>

    <div class="loader"></div>

    <div class="statusTitle">
      Preparing payment
    </div>

    <div class="statusSub">
      Opening your UPI app...
    </div>

  `);

}


/* ========================================
   WAITING
======================================== */

function showWaiting(){

  if(!currentOrderId){
    return;
  }


  showSheet(`

    <div class="handle"></div>

    <div class="loader"></div>

    <div class="statusTitle">
      Waiting for confirmation
    </div>

    <div class="statusAmount">
      ${formatMoney(PAYMENT_AMOUNT)}
    </div>

    <div class="statusSub">

      Complete your payment and return here.

      <br><br>

      Your payment is waiting for confirmation.

    </div>

    <div class="orderReference">

      Order:
      ${escapeHTML(currentOrderId)}

    </div>

    <button
      class="secondaryButton"
      onclick="checkPaymentNow()">

      Check payment status

    </button>

  `);

}


/* ========================================
   STATUS CHECKING
======================================== */

function startStatusChecking(){

  stopStatusChecking();

  checkPaymentStatus();


  statusTimer =
    setInterval(
      checkPaymentStatus,
      3000
    );

}


function stopStatusChecking(){

  if(statusTimer){

    clearInterval(
      statusTimer
    );

    statusTimer = null;

  }

}


/* ========================================
   CHECK PAYMENT
======================================== */

async function checkPaymentStatus(){

  if(!currentOrderId){
    return;
  }


  try{

    const response =
      await fetch(

        "/api/payment/status/" +
        encodeURIComponent(
          currentOrderId
        ),

        {
          cache:"no-store"
        }

      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){
      return;
    }


    const status =
      String(
        result.status || ""
      ).toUpperCase();


    if(
      status === "ACCEPTED" ||
      status === "SUCCESS"
    ){

      stopStatusChecking();

      clearPendingPayment();

      showSuccess(
        result.transactionId
      );

      return;

    }


    if(
      status === "REJECTED" ||
      status === "FAILED"
    ){

      stopStatusChecking();

      clearPendingPayment();

      showFailed();

      return;

    }


    /*
      PENDING:
      keep checking
    */


  }

  catch(error){

    console.error(
      "Status check:",
      error
    );

  }

}


/* ========================================
   MANUAL CHECK BUTTON
======================================== */

async function checkPaymentNow(){

  await checkPaymentStatus();

}


/* ========================================
   RETURN TO PAGE
======================================== */

window.addEventListener(
  "focus",
  () => {

    if(currentOrderId){

      showWaiting();

      checkPaymentStatus();

    }

  }
);


document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible" &&
      currentOrderId
    ){

      showWaiting();

      checkPaymentStatus();

    }

  }
);


/* ========================================
   RESTORE PENDING PAYMENT
======================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    try{

      const saved =
        JSON.parse(
          localStorage.getItem(
            "cezooPendingPayment"
          )
        );


      if(
        saved &&
        saved.orderId
      ){

        /*
          Only restore recent payment.
          30 minute window.
        */

        const age =
          Date.now() -
          Number(
            saved.createdAt || 0
          );


        if(
          age <
          30 * 60 * 1000
        ){

          currentOrderId =
            saved.orderId;

          showWaiting();

          startStatusChecking();

        }

        else{

          clearPendingPayment();

        }

      }

    }

    catch(error){

      clearPendingPayment();

    }

  }
);


/* ========================================
   SUCCESS
======================================== */

function showSuccess(transactionId){

  creatingPayment = false;

  setButtonsDisabled(false);


  let transactionHTML = "";


  if(transactionId){

    transactionHTML = `

      <div class="orderReference">

        Transaction:
        ${escapeHTML(transactionId)}

      </div>

    `;

  }


  showSheet(`

    <div class="handle"></div>

    <div class="statusCircle success">
      ✓
    </div>

    <div class="statusTitle">
      Payment accepted
    </div>

    <div class="statusAmount">
      ${formatMoney(PAYMENT_AMOUNT)}
    </div>

    <div class="statusSub">
      Your payment has been confirmed.
    </div>

    ${transactionHTML}

    <button
      class="actionButton"
      onclick="paymentDone()">

      Done

    </button>

  `);

}


/* ========================================
   FAILED
======================================== */

function showFailed(){

  creatingPayment = false;

  setButtonsDisabled(false);


  showSheet(`

    <div class="handle"></div>

    <div class="statusCircle failed">
      ×
    </div>

    <div class="statusTitle">
      Payment failed
    </div>

    <div class="statusAmount">
      ${formatMoney(PAYMENT_AMOUNT)}
    </div>

    <div class="statusSub">

      The payment was not accepted.

      Please try again.

    </div>

    <button
      class="actionButton"
      onclick="closeStatus()">

      Try again

    </button>

  `);

}


/* ========================================
   ERROR
======================================== */

function showError(message){

  showSheet(`

    <div class="handle"></div>

    <div class="statusCircle failed">
      !
    </div>

    <div class="statusTitle">
      Unable to start payment
    </div>

    <div class="statusSub">
      ${escapeHTML(message)}
    </div>

    <button
      class="actionButton"
      onclick="closeStatus()">

      Try again

    </button>

  `);

}


/* ========================================
   SHEET
======================================== */

function showSheet(html){

  const overlay =
    document.getElementById(
      "statusOverlay"
    );

  const sheet =
    document.getElementById(
      "statusSheet"
    );


  sheet.innerHTML =
    html;


  overlay.style.display =
    "flex";

}


function closeStatus(){

  document.getElementById(
    "statusOverlay"
  ).style.display =
    "none";

}


/* ========================================
   CLEAR PENDING
======================================== */

function clearPendingPayment(){

  localStorage.removeItem(
    "cezooPendingPayment"
  );

  currentOrderId = null;

}


/* ========================================
   DONE
======================================== */

function paymentDone(){

  closeStatus();

  /*
    Later CEZOO order success page:

    window.location.href =
      "order-success.html";
  */

}


/* ========================================
   SAFE HTML
======================================== */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>


</body>
</html>
