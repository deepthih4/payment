<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>CEZOO Payment</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial, Helvetica, sans-serif;
  background:#f5f6f8;
  color:#151515;
}

.page{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding-bottom:30px;
}

.header{
  padding:22px 20px 18px;
  border-bottom:1px solid #eee;
}

.brand{
  font-size:24px;
  font-weight:900;
  letter-spacing:.4px;
}

.secure{
  margin-top:4px;
  font-size:12px;
  color:#777;
}

.amountBox{
  margin:24px 18px 14px;
  padding:25px 18px;
  border-radius:20px;
  background:#f7f7f9;
  text-align:center;
}

.amountLabel{
  color:#777;
  font-size:13px;
  margin-bottom:7px;
}

.amount{
  font-size:36px;
  line-height:1;
  font-weight:900;
}

.paymentTitle{
  margin:28px 20px 12px;
  font-size:14px;
  font-weight:800;
}

.paymentButton{
  width:calc(100% - 36px);
  margin:0 18px 12px;
  min-height:66px;
  border:1px solid #ececec;
  border-radius:17px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:10px 15px;
  cursor:pointer;
  text-align:left;
}

.paymentButton:active{
  transform:scale(.985);
}

.paymentButton:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.icon{
  width:43px;
  height:43px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:13px;
  font-weight:900;
  color:#fff;
  flex-shrink:0;
}

.phonepe{
  background:#5f259f;
}

.paytm{
  background:#00b9f5;
}

.methodText{
  flex:1;
}

.methodName{
  font-size:15px;
  font-weight:800;
}

.methodSub{
  font-size:12px;
  color:#888;
  margin-top:3px;
}

.arrow{
  font-size:22px;
  color:#aaa;
}

.note{
  margin:20px 25px;
  text-align:center;
  font-size:11px;
  line-height:1.5;
  color:#999;
}


/* Bottom sheet */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:9998;
  opacity:0;
  visibility:hidden;
  transition:.2s;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

.sheet{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:0;
  width:100%;
  max-width:480px;
  transform:translate(-50%,105%);
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:25px 20px 30px;
  transition:.28s ease;
  box-shadow:0 -10px 40px rgba(0,0,0,.1);
}

.sheet.show{
  transform:translate(-50%,0);
}

.sheetTop{
  width:42px;
  height:4px;
  background:#ddd;
  border-radius:10px;
  margin:0 auto 24px;
}

.loader{
  width:46px;
  height:46px;
  border:4px solid #eee;
  border-top-color:#111;
  border-radius:50%;
  margin:5px auto 17px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.statusIcon{
  width:55px;
  height:55px;
  border-radius:50%;
  margin:5px auto 17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
}

.successIcon{
  background:#e8f8ef;
  color:#14934c;
}

.failedIcon{
  background:#fff0f0;
  color:#e04444;
}

.sheetTitle{
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.sheetAmount{
  text-align:center;
  margin-top:9px;
  font-size:27px;
  font-weight:900;
}

.sheetText{
  text-align:center;
  margin:10px auto 0;
  max-width:330px;
  color:#777;
  font-size:13px;
  line-height:1.5;
}

.orderReference{
  margin-top:18px;
  padding:12px;
  background:#f6f6f7;
  border-radius:12px;
  text-align:center;
  font-size:11px;
  color:#777;
  word-break:break-all;
}

.sheetButton{
  width:100%;
  height:51px;
  border:0;
  border-radius:14px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:800;
  margin-top:20px;
  cursor:pointer;
}

.secondaryButton{
  background:#f1f1f3;
  color:#111;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <div class="brand">CEZOO</div>
    <div class="secure">Secure UPI Payment</div>
  </div>


  <div class="amountBox">

    <div class="amountLabel">
      Amount to pay
    </div>

    <div class="amount" id="amount">
      ₹0
    </div>

  </div>


  <div class="paymentTitle">
    Pay using
  </div>


  <button
    class="paymentButton"
    id="phonepeButton"
    onclick="startPayment('phonepe')"
  >

    <div class="icon phonepe">
      P
    </div>

    <div class="methodText">
      <div class="methodName">PhonePe</div>
      <div class="methodSub">
        Pay securely using PhonePe
      </div>
    </div>

    <div class="arrow">›</div>

  </button>


  <button
    class="paymentButton"
    id="paytmButton"
    onclick="startPayment('paytm')"
  >

    <div class="icon paytm">
      P
    </div>

    <div class="methodText">
      <div class="methodName">Paytm</div>
      <div class="methodSub">
        Pay securely using Paytm
      </div>
    </div>

    <div class="arrow">›</div>

  </button>


  <div class="note">
    You will be redirected to your selected UPI app
    to complete the payment.
  </div>

</div>


<div
  class="overlay"
  id="overlay"
></div>


<div
  class="sheet"
  id="sheet"
>

  <div class="sheetTop"></div>

  <div id="sheetContent"></div>

</div>


<script>

/* ================================
   AMOUNT
================================ */

const urlParams =
  new URLSearchParams(window.location.search);

const rawAmount =
  urlParams.get("amount");

const PAYMENT_AMOUNT =
  Number(rawAmount);


const amountElement =
  document.getElementById("amount");


if(
  Number.isFinite(PAYMENT_AMOUNT) &&
  PAYMENT_AMOUNT > 0
){

  amountElement.textContent =
    "₹" + formatAmount(PAYMENT_AMOUNT);

}else{

  amountElement.textContent =
    "Amount unavailable";

  setButtonsDisabled(true);
}



/* ================================
   VARIABLES
================================ */

let currentOrderId = null;

let statusTimer = null;

let creatingPayment = false;



/* ================================
   FORMAT AMOUNT
================================ */

function formatAmount(value){

  const number = Number(value);

  if(!Number.isFinite(number)){
    return "0";
  }

  return number.toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:2
    }
  );
}



/* ================================
   PAYMENT
================================ */

async function startPayment(app){

  if(creatingPayment){
    return;
  }


  if(
    !Number.isFinite(PAYMENT_AMOUNT) ||
    PAYMENT_AMOUNT <= 0
  ){
    return;
  }


  creatingPayment = true;

  setButtonsDisabled(true);

  showPreparing();


  try{

    const response =
      await fetch(
        "/api/payment/create",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            amount:PAYMENT_AMOUNT,
            app:app
          })
        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "Unable to create payment"
      );

    }


    currentOrderId =
      result.orderId;


    localStorage.setItem(
      "cezooPendingPayment",
      JSON.stringify({

        orderId:currentOrderId,

        amount:PAYMENT_AMOUNT,

        createdAt:Date.now()

      })
    );


    /*
      Start checking order status.
    */

    startStatusChecking();


    /*
      IMPORTANT:
      Open selected UPI app.
    */

    openUPIApp(
      app,
      result.upiUrl
    );


    /*
      When customer comes back,
      show waiting screen.
    */

    setTimeout(function(){

      showWaiting();

    },1500);


  }catch(error){

    console.error(error);

    creatingPayment = false;

    setButtonsDisabled(false);

    showError(
      error.message ||
      "Payment service unavailable"
    );

  }

}



/* ================================
   OPEN UPI APP
================================ */

function openUPIApp(
  app,
  upiUrl
){

  if(!upiUrl){

    showError(
      "UPI payment link unavailable"
    );

    return;

  }


  const isAndroid =
    /Android/i.test(
      navigator.userAgent
    );


  /*
    ANDROID
  */

  if(isAndroid){

    /*
      Remove:
      upi://

      Example:
      upi://pay?pa=...

      becomes:
      pay?pa=...
    */

    const upiData =
      upiUrl.replace(
        /^upi:\/\//i,
        ""
      );


    let packageName = "";


    /*
      PhonePe Android package
    */

    if(app === "phonepe"){

      packageName =
        "com.phonepe.app";

    }


    /*
      Paytm Android package
    */

    else if(app === "paytm"){

      packageName =
        "net.one97.paytm";

    }


    /*
      Direct Android Intent
    */

    if(packageName){

      const intentUrl =
        "intent://" +
        upiData +
        "#Intent;" +
        "scheme=upi;" +
        "package=" +
        packageName +
        ";" +
        "end";


      window.location.href =
        intentUrl;


      return;

    }

  }


  /*
    iPhone / other browser
    Generic UPI fallback
  */

  window.location.href =
    upiUrl;

}



/* ================================
   STATUS CHECK
================================ */

function startStatusChecking(){

  stopStatusChecking();


  checkPaymentStatus();


  statusTimer =
    setInterval(
      checkPaymentStatus,
      3000
    );

}



function stopStatusChecking(){

  if(statusTimer){

    clearInterval(
      statusTimer
    );

    statusTimer = null;

  }

}



async function checkPaymentStatus(){

  if(!currentOrderId){
    return;
  }


  try{

    const response =
      await fetch(

        "/api/payment/status/" +
        encodeURIComponent(
          currentOrderId
        ),

        {
          cache:"no-store"
        }

      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      return;

    }


    const status =
      String(
        result.status || ""
      ).toUpperCase();


    /*
      SUCCESS
    */

    if(
      status === "ACCEPTED" ||
      status === "SUCCESS"
    ){

      stopStatusChecking();

      clearPendingPayment();

      showSuccess(
        result.transactionId
      );

      return;

    }


    /*
      FAILED
    */

    if(
      status === "REJECTED" ||
      status === "FAILED"
    ){

      stopStatusChecking();

      clearPendingPayment();

      showFailed();

      return;

    }


  }catch(error){

    console.error(
      "Status check:",
      error
    );

  }

}



/* ================================
   USER RETURNS FROM UPI APP
================================ */

window.addEventListener(
  "focus",
  function(){

    if(currentOrderId){

      creatingPayment = false;

      setButtonsDisabled(false);

      showWaiting();

      checkPaymentStatus();

    }

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState ===
      "visible" &&
      currentOrderId
    ){

      creatingPayment = false;

      setButtonsDisabled(false);

      showWaiting();

      checkPaymentStatus();

    }

  }
);



/* ================================
   RESTORE PAYMENT
================================ */

(function restorePayment(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "cezooPendingPayment"
        )
      );


    if(!saved){
      return;
    }


    /*
      Keep pending order
      maximum 30 minutes.
    */

    const age =
      Date.now() -
      Number(saved.createdAt || 0);


    if(
      age >
      30 * 60 * 1000
    ){

      clearPendingPayment();

      return;

    }


    currentOrderId =
      saved.orderId;


    if(currentOrderId){

      showWaiting();

      startStatusChecking();

    }


  }catch(error){

    clearPendingPayment();

  }

})();



function clearPendingPayment(){

  localStorage.removeItem(
    "cezooPendingPayment"
  );

}



/* ================================
   BUTTON STATE
================================ */

function setButtonsDisabled(
  disabled
){

  document
    .getElementById(
      "phonepeButton"
    )
    .disabled =
    disabled;


  document
    .getElementById(
      "paytmButton"
    )
    .disabled =
    disabled;

}



/* ================================
   SHEET
================================ */

function openSheet(){

  document
    .getElementById("overlay")
    .classList.add("show");


  document
    .getElementById("sheet")
    .classList.add("show");

}



function closeSheet(){

  document
    .getElementById("overlay")
    .classList.remove("show");


  document
    .getElementById("sheet")
    .classList.remove("show");

}



/* ================================
   PREPARING
================================ */

function showPreparing(){

  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="loader"></div>

    <div class="sheetTitle">
      Preparing payment
    </div>

    <div class="sheetAmount">
      ₹${formatAmount(PAYMENT_AMOUNT)}
    </div>

    <div class="sheetText">
      Opening your UPI app...
    </div>

  `;


  openSheet();

}



/* ================================
   WAITING
================================ */

function showWaiting(){

  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="loader"></div>

    <div class="sheetTitle">
      Waiting for confirmation
    </div>

    <div class="sheetAmount">
      ₹${formatAmount(PAYMENT_AMOUNT)}
    </div>

    <div class="sheetText">
      Complete your payment in the
      UPI app and return here.
    </div>

    <div class="orderReference">
      Order:
      ${currentOrderId || "-"}
    </div>

    <button
      class="sheetButton"
      onclick="checkPaymentStatus()"
    >
      Check payment status
    </button>

    <button
      class="sheetButton secondaryButton"
      onclick="closeSheet()"
    >
      Close
    </button>

  `;


  openSheet();

}



/* ================================
   SUCCESS
================================ */

function showSuccess(
  transactionId
){

  creatingPayment = false;

  setButtonsDisabled(false);


  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="
      statusIcon
      successIcon
    ">
      ✓
    </div>

    <div class="sheetTitle">
      Payment accepted
    </div>

    <div class="sheetAmount">
      ₹${formatAmount(PAYMENT_AMOUNT)}
    </div>

    <div class="sheetText">
      Your payment has been confirmed.
    </div>

    ${
      transactionId
      ?
      `
      <div class="orderReference">
        Transaction:
        ${transactionId}
      </div>
      `
      :
      ""
    }

    <button
      class="sheetButton"
      onclick="closeSheet()"
    >
      Done
    </button>

  `;


  openSheet();

}



/* ================================
   FAILED
================================ */

function showFailed(){

  creatingPayment = false;

  setButtonsDisabled(false);


  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="
      statusIcon
      failedIcon
    ">
      ×
    </div>

    <div class="sheetTitle">
      Payment failed
    </div>

    <div class="sheetAmount">
      ₹${formatAmount(PAYMENT_AMOUNT)}
    </div>

    <div class="sheetText">
      The payment was not completed.
      Please try again.
    </div>

    <button
      class="sheetButton"
      onclick="closeSheet()"
    >
      Try again
    </button>

  `;


  openSheet();

}



/* ================================
   ERROR
================================ */

function showError(message){

  document.getElementById(
    "sheetContent"
  ).innerHTML = `

    <div class="
      statusIcon
      failedIcon
    ">
      !
    </div>

    <div class="sheetTitle">
      Unable to continue
    </div>

    <div class="sheetText">
      ${message}
    </div>

    <button
      class="sheetButton"
      onclick="closeSheet()"
    >
      Close
    </button>

  `;


  openSheet();

}

</script>

</body>
</html>
