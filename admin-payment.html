<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>CEZOO Payment Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#f5f6f8;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


/* =========================
   HEADER
========================= */

.header{

  background:#fff;

  height:70px;

  border-bottom:1px solid #e9eaed;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 22px;

  position:sticky;

  top:0;

  z-index:20;

}


.brand{

  font-size:22px;

  font-weight:900;

  letter-spacing:.3px;

}


.headerRight{

  display:flex;

  align-items:center;

  gap:9px;

  font-size:12px;

  color:#777;

}


.onlineDot{

  width:8px;

  height:8px;

  border-radius:50%;

  background:#19a763;

}


/* =========================
   PAGE
========================= */

.container{

  width:100%;

  max-width:900px;

  margin:auto;

  padding:25px 17px 40px;

}


.pageTitle{

  font-size:25px;

  font-weight:850;

}


.pageSub{

  margin-top:5px;

  font-size:13px;

  color:#7b818a;

}


/* =========================
   SUMMARY
========================= */

.summary{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:11px;

  margin-top:22px;

}


.summaryCard{

  background:#fff;

  border:1px solid #ececef;

  border-radius:16px;

  padding:16px;

}


.summaryLabel{

  font-size:11px;

  color:#858b93;

}


.summaryValue{

  margin-top:6px;

  font-size:22px;

  font-weight:850;

}


/* =========================
   SECTION
========================= */

.section{

  margin-top:25px;

}


.sectionTop{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:13px;

}


.sectionTitle{

  font-size:16px;

  font-weight:800;

}


.refreshButton{

  height:36px;

  padding:0 13px;

  border:1px solid #e5e7eb;

  background:#fff;

  border-radius:10px;

  cursor:pointer;

  font-size:12px;

  font-weight:700;

}


/* =========================
   ORDER CARD
========================= */

.orders{

  display:flex;

  flex-direction:column;

  gap:11px;

}


.orderCard{

  background:#fff;

  border:1px solid #e8e9ec;

  border-radius:18px;

  padding:17px;

}


.orderTop{

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:15px;

}


.orderId{

  font-size:13px;

  font-weight:800;

  word-break:break-all;

}


.orderTime{

  margin-top:5px;

  font-size:11px;

  color:#90959d;

}


.amount{

  font-size:20px;

  font-weight:850;

  white-space:nowrap;

}


.status{

  display:inline-flex;

  margin-top:13px;

  padding:5px 9px;

  border-radius:20px;

  font-size:10px;

  font-weight:800;

}


.statusPending{

  background:#fff6df;

  color:#a66a00;

}


.statusAccepted{

  background:#e8f8ef;

  color:#13874f;

}


.statusRejected{

  background:#fff0f0;

  color:#d83e45;

}


.actions{

  display:flex;

  gap:9px;

  margin-top:16px;

}


.actionButton{

  flex:1;

  height:45px;

  border:0;

  border-radius:12px;

  font-size:13px;

  font-weight:800;

  cursor:pointer;

}


.accept{

  background:#15945f;

  color:#fff;

}


.reject{

  background:#fff;

  color:#d83e45;

  border:1px solid #f0cfd1;

}


.actionButton:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =========================
   EMPTY
========================= */

.empty{

  background:#fff;

  border:1px solid #ececef;

  border-radius:18px;

  padding:45px 20px;

  text-align:center;

}


.emptyIcon{

  font-size:35px;

}


.emptyTitle{

  margin-top:12px;

  font-size:16px;

  font-weight:800;

}


.emptyText{

  margin-top:5px;

  font-size:12px;

  color:#888;

}


/* =========================
   LOADING
========================= */

.loading{

  padding:45px;

  text-align:center;

  color:#777;

  font-size:13px;

}


.smallLoader{

  width:28px;

  height:28px;

  border:3px solid #eee;

  border-top-color:#111;

  border-radius:50%;

  margin:0 auto 12px;

  animation:spin .7s linear infinite;

}


@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   MESSAGE
========================= */

.message{

  position:fixed;

  left:50%;

  bottom:20px;

  transform:
    translate(-50%,20px);

  background:#111827;

  color:#fff;

  padding:12px 18px;

  border-radius:12px;

  font-size:12px;

  font-weight:700;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:100;

}


.message.show{

  opacity:1;

  transform:
    translate(-50%,0);

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .header{

    padding:0 16px;

  }


  .container{

    padding:
      21px 13px
      35px;

  }


  .pageTitle{

    font-size:22px;

  }


  .summary{

    grid-template-columns:
      repeat(3,1fr);

    gap:7px;

  }


  .summaryCard{

    padding:12px;

  }


  .summaryValue{

    font-size:18px;

  }


  .orderCard{

    padding:15px;

  }


  .actions{

    gap:8px;

  }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

  <div class="brand">
    CEZOO
  </div>

  <div class="headerRight">

    <span class="onlineDot"></span>

    Payment Admin

  </div>

</header>



<main class="container">


  <div class="pageTitle">
    Payment confirmations
  </div>

  <div class="pageSub">
    Review customer payments and confirm orders.
  </div>



  <!-- SUMMARY -->

  <div class="summary">

    <div class="summaryCard">

      <div class="summaryLabel">
        Pending
      </div>

      <div
        class="summaryValue"
        id="pendingCount">
        0
      </div>

    </div>


    <div class="summaryCard">

      <div class="summaryLabel">
        Accepted
      </div>

      <div
        class="summaryValue"
        id="acceptedCount">
        0
      </div>

    </div>


    <div class="summaryCard">

      <div class="summaryLabel">
        Rejected
      </div>

      <div
        class="summaryValue"
        id="rejectedCount">
        0
      </div>

    </div>

  </div>



  <!-- ORDERS -->

  <section class="section">

    <div class="sectionTop">

      <div class="sectionTitle">
        Payment requests
      </div>

      <button
        class="refreshButton"
        onclick="loadPayments()">

        ↻ Refresh

      </button>

    </div>


    <div
      class="orders"
      id="orders">

      <div class="loading">

        <div class="smallLoader"></div>

        Loading payments...

      </div>

    </div>

  </section>


</main>



<div
  class="message"
  id="message">
</div>



<script>

/* =====================================
   LOAD PAYMENTS
===================================== */

async function loadPayments(){

  const orders =
    document.getElementById(
      "orders"
    );


  orders.innerHTML = `

    <div class="loading">

      <div class="smallLoader"></div>

      Loading payments...

    </div>

  `;


  try{

    /*
      Next server.js endpoint:
      GET /api/admin/payments

      will return the orders.
    */

    const response =
      await fetch(
        "/api/admin/payments",
        {
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "Unable to load payments"
      );

    }


    renderPayments(
      result.payments || []
    );


  }

  catch(error){

    console.error(error);

    orders.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          ⚠️
        </div>

        <div class="emptyTitle">
          Unable to load payments
        </div>

        <div class="emptyText">
          ${escapeHTML(
            error.message
          )}
        </div>

      </div>

    `;

  }

}



/* =====================================
   RENDER
===================================== */

function renderPayments(
  payments
){

  const orders =
    document.getElementById(
      "orders"
    );


  let pending = 0;

  let accepted = 0;

  let rejected = 0;


  payments.forEach(
    payment => {

      const status =
        String(
          payment.status || ""
        ).toUpperCase();


      if(status === "PENDING"){
        pending++;
      }

      if(
        status === "ACCEPTED" ||
        status === "SUCCESS"
      ){
        accepted++;
      }

      if(
        status === "REJECTED" ||
        status === "FAILED"
      ){
        rejected++;
      }

    }
  );


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending;


  document.getElementById(
    "acceptedCount"
  ).textContent =
    accepted;


  document.getElementById(
    "rejectedCount"
  ).textContent =
    rejected;


  if(!payments.length){

    orders.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          💳
        </div>

        <div class="emptyTitle">
          No payment requests
        </div>

        <div class="emptyText">
          New customer payments will appear here.
        </div>

      </div>

    `;

    return;

  }


  orders.innerHTML =
    payments.map(
      payment => {

        const status =
          String(
            payment.status || "PENDING"
          ).toUpperCase();


        let statusClass =
          "statusPending";


        let statusText =
          "PENDING";


        if(
          status === "ACCEPTED" ||
          status === "SUCCESS"
        ){

          statusClass =
            "statusAccepted";

          statusText =
            "ACCEPTED";

        }


        if(
          status === "REJECTED" ||
          status === "FAILED"
        ){

          statusClass =
            "statusRejected";

          statusText =
            "REJECTED";

        }


        const isPending =
          status === "PENDING";


        return `

          <div class="orderCard">

            <div class="orderTop">

              <div>

                <div class="orderId">
                  ${escapeHTML(
                    payment.order_id
                  )}
                </div>

                <div class="orderTime">
                  ${formatDate(
                    payment.created_at
                  )}
                </div>

              </div>

              <div class="amount">
                ₹${formatAmount(
                  payment.amount
                )}
              </div>

            </div>


            <div class="
              status
              ${statusClass}
            ">
              ${statusText}
            </div>


            ${
              isPending
              ?
              `

              <div class="actions">

                <button
                  class="
                    actionButton
                    accept
                  "
                  onclick="
                    updatePayment(
                      '${safeJS(payment.order_id)}',
                      'ACCEPTED'
                    )
                  ">

                  ✓ Accept

                </button>


                <button
                  class="
                    actionButton
                    reject
                  "
                  onclick="
                    updatePayment(
                      '${safeJS(payment.order_id)}',
                      'REJECTED'
                    )
                  ">

                  ✕ Reject

                </button>

              </div>

              `
              :
              ""
            }

          </div>

        `;

      }
    ).join("");

}



/* =====================================
   UPDATE PAYMENT
===================================== */

async function updatePayment(
  orderId,
  status
){

  const confirmText =
    status === "ACCEPTED"
    ?
    "Confirm this payment as ACCEPTED?"
    :
    "Mark this payment as REJECTED?";


  if(
    !window.confirm(
      confirmText
    )
  ){

    return;

  }


  try{

    /*
      Next server.js endpoint:
      POST /api/admin/payment/status
    */

    const response =
      await fetch(
        "/api/admin/payment/status",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              orderId:
                orderId,

              status:
                status

            })

        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "Unable to update payment"
      );

    }


    showMessage(
      status === "ACCEPTED"
      ?
      "Payment accepted"
      :
      "Payment rejected"
    );


    loadPayments();


  }

  catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Unable to update payment"
    );

  }

}



/* =====================================
   MESSAGE
===================================== */

function showMessage(
  text
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.classList.add(
    "show"
  );


  setTimeout(
    () => {

      message.classList.remove(
        "show"
      );

    },
    2500
  );

}



/* =====================================
   FORMAT
===================================== */

function formatAmount(
  value
){

  return Number(
    value || 0
  ).toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:2
    }
  );

}


function formatDate(
  value
){

  if(!value){
    return "Date unavailable";
  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "Date unavailable";

  }


  return date.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}



/* =====================================
   SAFE HTML
===================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


function safeJS(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  )
  .replaceAll(
    "\n",
    "\\n"
  )
  .replaceAll(
    "\r",
    "\\r"
  );

}


/* =====================================
   AUTO REFRESH
===================================== */

loadPayments();


setInterval(
  loadPayments,
  5000
);

</script>

</body>
</html>
