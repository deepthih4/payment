<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>CEZOO Payment Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#f5f6f8;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


/* ==============================
   HEADER
============================== */

.header{
  height:70px;
  padding:0 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#fff;

  border-bottom:1px solid #e9eaed;

  position:sticky;
  top:0;

  z-index:20;
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:.3px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;

  font-size:12px;
  color:#777;
}

.onlineDot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#19a763;
}


/* ==============================
   PAGE
============================== */

.container{
  width:100%;
  max-width:1100px;

  margin:auto;

  padding:25px 17px 50px;
}

.pageTitle{
  font-size:25px;
  font-weight:850;
}

.pageSub{
  margin-top:6px;

  font-size:13px;
  color:#7b818a;
}


/* ==============================
   SUMMARY
============================== */

.summary{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:14px;

  margin-top:27px;
}

.summaryCard{
  min-height:104px;

  padding:20px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  background:#fff;

  border:1px solid #e8e9ec;

  border-radius:20px;
}

.summaryLabel{
  font-size:12px;
  color:#858b93;
}

.summaryValue{
  margin-top:8px;

  font-size:24px;
  font-weight:900;
}


/* ==============================
   SECTION
============================== */

.section{
  margin-top:31px;
}

.sectionTop{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  margin-bottom:16px;
}

.sectionTitle{
  font-size:17px;
  font-weight:850;
}

.refreshButton{
  height:42px;

  padding:0 16px;

  border:1px solid #e1e3e6;
  border-radius:13px;

  background:#fff;

  color:#111827;

  font-size:12px;
  font-weight:750;

  cursor:pointer;
}

.refreshButton:active{
  transform:scale(.97);
}

.refreshButton:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* ==============================
   ORDERS
============================== */

.orders{
  display:flex;
  flex-direction:column;

  gap:14px;
}


/* ==============================
   ORDER CARD
============================== */

.orderCard{
  padding:20px;

  background:#fff;

  border:1px solid #e5e7eb;
  border-radius:21px;
}

.orderTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:20px;
}

.orderId{
  font-size:13px;
  font-weight:850;

  word-break:break-all;
}

.orderTime{
  margin-top:7px;

  font-size:11px;
  color:#9297a0;
}

.amount{
  flex-shrink:0;

  font-size:21px;
  font-weight:900;
}


/* ==============================
   STATUS
============================== */

.status{
  display:inline-flex;

  margin-top:16px;

  padding:6px 11px;

  border-radius:50px;

  font-size:10px;
  font-weight:850;
}

.statusPending{
  background:#fff4d7;
  color:#9c6500;
}

.statusAccepted{
  background:#e5f8ed;
  color:#11844e;
}

.statusRejected{
  background:#ffeded;
  color:#d83e45;
}


/* ==============================
   ACTION BUTTONS
============================== */

.actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;

  margin-top:19px;
}

.actionButton{
  height:55px;

  border-radius:15px;

  font-size:14px;
  font-weight:850;

  cursor:pointer;
}

.accept{
  border:0;

  background:#179b68;
  color:#fff;
}

.reject{
  border:1px solid #efc7ca;

  background:#fff;

  color:#e03e45;
}

.actionButton:active{
  transform:scale(.985);
}

.actionButton:disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* ==============================
   INITIAL LOADER
============================== */

.initialLoading{
  padding:70px 20px;

  background:#fff;

  border:1px solid #e8e9ec;
  border-radius:20px;

  text-align:center;

  color:#7c828b;

  font-size:13px;
}

.loader{
  width:31px;
  height:31px;

  margin:0 auto 13px;

  border:3px solid #ececec;
  border-top-color:#111827;

  border-radius:50%;

  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* ==============================
   EMPTY / ERROR
============================== */

.empty{
  padding:55px 20px;

  background:#fff;

  border:1px solid #e8e9ec;
  border-radius:20px;

  text-align:center;
}

.emptyIcon{
  font-size:33px;
}

.emptyTitle{
  margin-top:12px;

  font-size:16px;
  font-weight:850;
}

.emptyText{
  margin-top:6px;

  font-size:12px;
  color:#858b93;
}


/* ==============================
   TOAST
============================== */

.toast{
  position:fixed;

  left:50%;
  bottom:24px;

  z-index:1000;

  min-width:180px;

  max-width:calc(100% - 30px);

  padding:13px 18px;

  border-radius:13px;

  background:#111827;
  color:#fff;

  text-align:center;

  font-size:12px;
  font-weight:750;

  opacity:0;

  pointer-events:none;

  transform:
    translate(-50%,20px);

  transition:.22s ease;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* ==============================
   MOBILE
============================== */

@media(max-width:600px){

  .header{
    height:64px;
    padding:0 15px;
  }

  .brand{
    font-size:20px;
  }

  .container{
    padding:
      21px 13px
      40px;
  }

  .pageTitle{
    font-size:22px;
  }

  .summary{
    gap:7px;
    margin-top:22px;
  }

  .summaryCard{
    min-height:90px;
    padding:13px;
    border-radius:16px;
  }

  .summaryLabel{
    font-size:10px;
  }

  .summaryValue{
    font-size:20px;
  }

  .section{
    margin-top:27px;
  }

  .orderCard{
    padding:16px;
    border-radius:17px;
  }

  .actions{
    gap:8px;
  }

  .actionButton{
    height:49px;
  }

}


/* ==============================
   SMALL MOBILE
============================== */

@media(max-width:380px){

  .summaryCard{
    padding:10px;
  }

  .summaryValue{
    font-size:18px;
  }

}

</style>
</head>


<body>


<!-- ============================
     HEADER
============================ -->

<header class="header">

  <div class="brand">
    CEZOO
  </div>

  <div class="headerRight">

    <span class="onlineDot"></span>

    Payment Admin

  </div>

</header>



<!-- ============================
     MAIN
============================ -->

<main class="container">

  <h1 class="pageTitle">
    Payment confirmations
  </h1>

  <div class="pageSub">
    Review customer payments and confirm orders.
  </div>


  <!-- SUMMARY -->

  <div class="summary">

    <div class="summaryCard">

      <div class="summaryLabel">
        Pending
      </div>

      <div
        class="summaryValue"
        id="pendingCount">
        0
      </div>

    </div>


    <div class="summaryCard">

      <div class="summaryLabel">
        Accepted
      </div>

      <div
        class="summaryValue"
        id="acceptedCount">
        0
      </div>

    </div>


    <div class="summaryCard">

      <div class="summaryLabel">
        Rejected
      </div>

      <div
        class="summaryValue"
        id="rejectedCount">
        0
      </div>

    </div>

  </div>



  <!-- PAYMENT REQUESTS -->

  <section class="section">

    <div class="sectionTop">

      <div class="sectionTitle">
        Payment requests
      </div>


      <button
        class="refreshButton"
        id="refreshButton"
        onclick="manualRefresh()">

        ↻ Refresh

      </button>

    </div>


    <div
      class="orders"
      id="orders">

      <!--
        Loader only shown FIRST TIME.
        Auto refresh will NOT show this again.
      -->

      <div class="initialLoading">

        <div class="loader"></div>

        Loading payments...

      </div>

    </div>

  </section>

</main>



<!-- TOAST -->

<div
  class="toast"
  id="toast">
</div>



<script>

/* =========================================
   VARIABLES
========================================= */

let firstLoad = true;

let currentlyLoading = false;

let lastPaymentsJSON = "";


/* =========================================
   LOAD PAYMENTS
========================================= */

async function loadPayments(
  forceRender = false
){

  /*
    Prevent multiple API requests
    at the same time.
  */

  if(currentlyLoading){
    return;
  }


  currentlyLoading = true;


  try{

    const response =
      await fetch(
        "/api/admin/payments",
        {
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "Unable to load payments"
      );

    }


    const payments =
      Array.isArray(
        result.payments
      )
      ?
      result.payments
      :
      [];


    /*
      Compare old data with new data.

      If NOTHING changed,
      we do NOT touch the HTML.

      So no blinking / loading.
    */

    const newJSON =
      JSON.stringify(
        payments
      );


    if(
      firstLoad ||
      forceRender ||
      newJSON !== lastPaymentsJSON
    ){

      renderPayments(
        payments
      );


      lastPaymentsJSON =
        newJSON;

    }


    firstLoad = false;


  }

  catch(error){

    console.error(
      "Load payments error:",
      error
    );


    /*
      Error page only on FIRST load.

      If auto refresh later fails,
      existing payment cards remain visible.
    */

    if(firstLoad){

      document.getElementById(
        "orders"
      ).innerHTML = `

        <div class="empty">

          <div class="emptyIcon">
            ⚠️
          </div>

          <div class="emptyTitle">
            Unable to load payments
          </div>

          <div class="emptyText">
            ${escapeHTML(
              error.message
            )}
          </div>

        </div>

      `;

    }


  }

  finally{

    currentlyLoading = false;

  }

}


/* =========================================
   MANUAL REFRESH
========================================= */

async function manualRefresh(){

  const button =
    document.getElementById(
      "refreshButton"
    );


  button.disabled = true;

  button.textContent =
    "Refreshing...";


  await loadPayments(
    true
  );


  button.disabled = false;

  button.textContent =
    "↻ Refresh";

}


/* =========================================
   RENDER PAYMENTS
========================================= */

function renderPayments(
  payments
){

  const orders =
    document.getElementById(
      "orders"
    );


  /*
    COUNTS
  */

  let pending = 0;

  let accepted = 0;

  let rejected = 0;


  payments.forEach(
    payment => {

      const status =
        String(
          payment.status ||
          "PENDING"
        )
        .toUpperCase();


      if(
        status === "PENDING"
      ){

        pending++;

      }


      if(
        status === "ACCEPTED" ||
        status === "SUCCESS"
      ){

        accepted++;

      }


      if(
        status === "REJECTED" ||
        status === "FAILED"
      ){

        rejected++;

      }

    }
  );


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending;


  document.getElementById(
    "acceptedCount"
  ).textContent =
    accepted;


  document.getElementById(
    "rejectedCount"
  ).textContent =
    rejected;



  /*
    EMPTY
  */

  if(
    payments.length === 0
  ){

    orders.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          💳
        </div>

        <div class="emptyTitle">
          No payment requests
        </div>

        <div class="emptyText">
          New customer payments will
          automatically appear here.
        </div>

      </div>

    `;

    return;

  }



  /*
    SORT

    Pending first.
    Newest ID first.
  */

  const sorted =
    [...payments]
    .sort(
      (a,b) => {

        const aStatus =
          String(
            a.status || ""
          ).toUpperCase();

        const bStatus =
          String(
            b.status || ""
          ).toUpperCase();


        if(
          aStatus === "PENDING" &&
          bStatus !== "PENDING"
        ){
          return -1;
        }


        if(
          bStatus === "PENDING" &&
          aStatus !== "PENDING"
        ){
          return 1;
        }


        return (
          Number(b.id || 0) -
          Number(a.id || 0)
        );

      }
    );



  /*
    CREATE CARDS
  */

  orders.innerHTML =
    sorted.map(
      payment => {

        const orderId =
          String(
            payment.order_id ||
            ""
          );


        const status =
          String(
            payment.status ||
            "PENDING"
          )
          .toUpperCase();


        let statusClass =
          "statusPending";


        let statusText =
          "PENDING";


        if(
          status === "ACCEPTED" ||
          status === "SUCCESS"
        ){

          statusClass =
            "statusAccepted";

          statusText =
            "ACCEPTED";

        }


        if(
          status === "REJECTED" ||
          status === "FAILED"
        ){

          statusClass =
            "statusRejected";

          statusText =
            "REJECTED";

        }


        const isPending =
          status === "PENDING";


        return `

          <article
            class="orderCard"
            data-order-id="
              ${escapeHTML(orderId)}
            "
          >

            <div class="orderTop">

              <div>

                <div class="orderId">

                  ${escapeHTML(
                    orderId
                  )}

                </div>

                <div class="orderTime">

                  Payment request

                </div>

              </div>


              <div class="amount">

                ₹${formatAmount(
                  payment.amount
                )}

              </div>

            </div>


            <div
              class="
                status
                ${statusClass}
              "
            >

              ${statusText}

            </div>


            ${
              isPending
              ?
              `

              <div class="actions">


                <button
                  class="
                    actionButton
                    accept
                  "
                  onclick="
                    updatePayment(
                      '${safeJS(orderId)}',
                      'ACCEPTED',
                      this
                    )
                  "
                >

                  ✓ Accept

                </button>


                <button
                  class="
                    actionButton
                    reject
                  "
                  onclick="
                    updatePayment(
                      '${safeJS(orderId)}',
                      'REJECTED',
                      this
                    )
                  "
                >

                  ✕ Reject

                </button>


              </div>

              `
              :
              ""
            }

          </article>

        `;

      }
    )
    .join("");

}


/* =========================================
   ACCEPT / REJECT
========================================= */

async function updatePayment(
  orderId,
  status,
  clickedButton
){

  const message =
    status === "ACCEPTED"
    ?
    "Confirm this payment as ACCEPTED?"
    :
    "Reject this payment?";


  if(
    !window.confirm(
      message
    )
  ){

    return;

  }


  /*
    Disable both buttons
    inside this card.
  */

  const card =
    clickedButton.closest(
      ".orderCard"
    );


  const buttons =
    card
      ?
      card.querySelectorAll(
        ".actionButton"
      )
      :
      [];


  buttons.forEach(
    button => {

      button.disabled =
        true;

    }
  );


  const oldText =
    clickedButton.textContent;


  clickedButton.textContent =
    status === "ACCEPTED"
    ?
    "Accepting..."
    :
    "Rejecting...";


  try{

    const response =
      await fetch(
        "/api/admin/payment/status",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              orderId:
                orderId,

              status:
                status

            })

        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "Unable to update payment"
      );

    }


    showToast(
      status === "ACCEPTED"
      ?
      "✓ Payment accepted"
      :
      "Payment rejected"
    );


    /*
      Silent refresh.
      No loader.
    */

    await loadPayments(
      true
    );


  }

  catch(error){

    console.error(
      "Update payment:",
      error
    );


    showToast(
      error.message ||
      "Unable to update payment"
    );


    buttons.forEach(
      button => {

        button.disabled =
          false;

      }
    );


    clickedButton.textContent =
      oldText;

  }

}


/* =========================================
   AUTO REFRESH

   Silent background refresh.
   NO loader.
   NO page blinking.
========================================= */

setInterval(
  function(){

    loadPayments(
      false
    );

  },
  5000
);


/* =========================================
   TOAST
========================================= */

let toastTimer = null;


function showToast(
  text
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  if(toastTimer){

    clearTimeout(
      toastTimer
    );

  }


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      2300
    );

}


/* =========================================
   FORMAT AMOUNT
========================================= */

function formatAmount(
  value
){

  const number =
    Number(
      value || 0
    );


  return number.toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:2
    }
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================================
   SAFE JS STRING
========================================= */

function safeJS(
  value
){

  return String(
    value ?? ""
  )

  .replaceAll(
    "\\",
    "\\\\"
  )

  .replaceAll(
    "'",
    "\\'"
  )

  .replaceAll(
    "\n",
    "\\n"
  )

  .replaceAll(
    "\r",
    "\\r"
  );

}


/* =========================================
   FIRST LOAD
========================================= */

loadPayments();

</script>

</body>
</html>
